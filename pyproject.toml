[project]
name = "tg-agent"
version = "0.1.0"
description = "Ограниченный доступ Claude Code агентов к Telegram (MCP-сервер + CLI)"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "python-dotenv>=1.0",
    "mcp>=2,<3",
    "httpx[socks]>=0.28.1",
]

[project.scripts]
tg = "tg_agent.cli:main"
tg-mcp = "tg_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_agent"]
