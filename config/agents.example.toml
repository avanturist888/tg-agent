# Агенты в контейнерах: MCP-сервер telegram по HTTP (streamable HTTP).
# Скопировать в config/agents.toml (он не коммитится). Файл и токены в .env
# перечитываются на каждом запросе; адрес — раз в 30 секунд.
#
# Агенту из контейнера видны только его чаты (подмножество белого списка
# config/chats.toml), их черновики и тред шлюза в его окружении. Файлы с
# диска шлюза (files у tg_draft_message) и скачивание на диск шлюза
# (tg_download_file) ему недоступны. Каждый его вызов — в аудит с именем.

[http]
# Где служба слушает. Контейнер на этом же хосте (Docker Desktop) видит
# 127.0.0.1 хоста как host.docker.internal: http://host.docker.internal:8790/mcp
# Для контейнеров на других машинах — адрес tailnet или SSH-туннель; токены
# идут открытым HTTP, так что наружу в интернет этот порт не публиковать.
listen = "127.0.0.1:8790"

[[agent]]
name = "bala"                          # имя в аудите и на карточке «Агент bala просит отправить…»
token_env = "TG_AGENT_BALA_TOKEN"      # переменная в .env с его токеном (tg agents --new-token)
chats = ["saved"]                      # alias'ы из config/chats.toml: всё остальное ему не существует
env = "bala"                           # окружение из config/t3.toml: там его tg_subscribe заводит тред
