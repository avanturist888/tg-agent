# Окружения T3 Code в контейнерах (или на других машинах): каждый — свой
# сервер `t3 serve`. Скопировать в config/t3.toml (он не коммитится).
#
# Местный десктоп T3 Code описывать не нужно: это окружение «local», с ним
# служба работает как раньше — будит тред по id сессии Claude.
#
# В окружениях отсюда служба заводит свои треды «TG: <чат>» — по одному на
# пару (окружение, чат) — и будит их ходом с уведомлением, когда в чате
# новое (подписка — tg_subscribe агента из config/agents.toml или
# `tg t3 subscribe <окружение> <alias>`). Файл перечитывается на лету.

[[env]]
name = "bala"                          # имя: в agents.toml (env = …) и в `tg t3 …`
origin = "http://127.0.0.1:3774"       # сервер T3: порт контейнера на loopback, tailnet или туннель
model = "claude-sonnet-5-5"            # модель ходов в тредах шлюза (провайдер claudeAgent)
# project = "/workspace"               # проект тредов (workspaceRoot, id или название); по умолчанию — первый
turn_timeout_sec = 900                 # сколько ждать конца хода
# poll_sec = 2.5                       # как часто опрашивать тред, пока идёт ход

# Токен: служба выпускает его сама (права только на треды: orchestration:read
# и orchestration:operate, 30 дней), хранит в data/t3-token-<name>.json и
# перевыпускает, когда сервер ответил 401 или срок на исходе. Источник
# одноразового кода — одно из (можно несколько):
#
# 1) команда, печатающая JSON с полем credential (выполняется на этой машине;
#    без --base-dir: образ сам задаёт T3CODE_HOME):
pairing_cmd = ["docker", "exec", "t3-bala", "t3", "auth", "pairing", "create", "--ttl", "5m", "--label", "tg-agent", "--json"]
#
# 2) admin-токен сервера (с правом access:write) — имя переменной в .env;
#    код выдаёт сам сервер: POST /api/auth/pairing-token:
# admin_token_env = "T3_BALA_ADMIN_TOKEN"
#
# 3) готовый bearer-токен файлом: {"token": "…"} или просто строка. Если
#    других способов нет, после его отзыва (401) нужно обновить файл.
# token_file = "C:/secrets/t3-bala-token.json"
