# Белый список чатов. Агент видит ТОЛЬКО то, что перечислено здесь.
# Всё остальное для него не существует: ни прочитать, ни написать.
#
# Удобнее всего править через окно управления (bin	gw.exe gui, вкладка «Чаты»)
# или командой: bin	g.exe allow <alias> --match "кусок названия" [--send [--auto]]
# Как узнать id чата:  bin	g.exe dialogs --filter "кусок названия"
# После правки файла MCP-сервер подхватывает изменения на следующем вызове,
# перезапускать Claude Code не нужно.

[[chat]]
alias = "work-team"          # короткое имя, которым агент обращается к чату
id = -1001234567890          # id из `tg dialogs` (у групп/каналов отрицательный)
title = "Рабочая группа"     # человекочитаемое описание, для себя
read = true                  # агент может читать историю
send = false                 # агент может отправлять (с учётом TG_SEND_POLICY)
note = "Только чтение задач, писать туда нельзя"

[[chat]]
alias = "saved"
id = "me"                    # "me" = Избранное (Saved Messages)
title = "Избранное"
read = true
send = true
note = "Песочница: сюда агент может писать свободно"

[[chat]]
alias = "deploy-bot"
id = "@my_deploy_bot"        # username тоже годится
title = "Бот деплоя"
read = true
send = true
auto_send = true             # без кнопки: сообщение уходит само через
                             # TG_AUTO_SEND_DELAY_SEC (30 с), если агент не отменит
